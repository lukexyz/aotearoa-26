<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0c1614">
<title>Aotearoa 2026 · South Island road trip</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Aotearoa 26">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{
  --ink:#0c1614; --panel:rgba(14,30,27,.93); --panel-solid:#132622;
  --line:rgba(244,239,231,.14); --cream:#F4EFE7; --muted:#92a89f; --soft:#c3d1cb;
  --amber:#F2B33D; --coral:#E8643A; --coral2:#f59a7a; --teal:#3FB4A6;
  --topbar:64px; --brief:340px; --cards:290px;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--ink);color:var(--cream);overflow:hidden;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
a{color:var(--amber)}

/* ================= MAP ================= */
#map{position:fixed;inset:var(--topbar) 0 0 0;background:#0b1412;z-index:1}
.leaflet-container{font-family:inherit;background:#0b1412}

/* ================= TOP BAR ================= */
#top{position:fixed;top:0;left:0;right:0;height:var(--topbar);z-index:1000;display:flex;align-items:center;
  gap:14px;padding:0 14px;background:rgba(12,22,20,.93);backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);box-shadow:0 4px 26px rgba(0,0,0,.5)}
#brand{display:flex;align-items:baseline;gap:10px;flex:0 0 auto;white-space:nowrap}
.brand-t{font-size:16px;font-weight:800;letter-spacing:-.02em}
.brand-t em{font-style:normal;color:var(--amber)}
.brand-d{font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}

#nav{flex:1 1 auto;display:flex;align-items:center;justify-content:center;gap:6px;min-width:0}
.nav-arrow{width:32px;height:32px;border-radius:8px;background:rgba(255,255,255,.06);display:flex;align-items:center;
  justify-content:center;font-size:18px;color:var(--muted);flex:0 0 auto;transition:.15s}
.nav-arrow:hover{background:rgba(255,255,255,.14);color:var(--cream)}
.nav-arrow:disabled{opacity:.25;cursor:default}
#nav-days{display:flex;gap:5px;overflow-x:auto;scrollbar-width:none;padding:3px 2px}
#nav-days::-webkit-scrollbar{display:none}
.nav-day{flex:0 0 auto;padding:5px 11px 6px;border-radius:9px;background:rgba(255,255,255,.05);
  border:1px solid transparent;text-align:center;line-height:1.1;transition:.15s;min-width:62px;min-height:44px}
.nav-day:hover{background:rgba(255,255,255,.11)}
.nav-day .nav-k{font-size:9.5px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.nav-day .nav-v{font-size:13px;font-weight:800;margin-top:2px;white-space:nowrap}
.nav-day.on{background:var(--coral);border-color:var(--coral);box-shadow:0 3px 16px rgba(232,100,58,.4)}
.nav-day.on .nav-k{color:rgba(255,255,255,.82)}
.nav-day.on .nav-v{color:#fff}
.nav-day.nav-all .nav-v{font-size:11.5px;letter-spacing:.05em;padding-top:2px}

#topright{flex:0 0 auto;display:flex;gap:7px;align-items:center}
.base-switch{display:flex;gap:2px;padding:3px;border:1px solid var(--line);border-radius:9px;background:rgba(255,255,255,.04)}
.base-btn{padding:6px 8px;border-radius:6px;font-size:9px;font-weight:900;letter-spacing:.08em;line-height:1;
  text-transform:uppercase;color:var(--muted);white-space:nowrap;min-height:28px}
.base-btn:hover{color:var(--cream);background:rgba(255,255,255,.08)}
.base-btn.on{background:var(--amber);color:#1a1206}
.top-btn{padding:8px 12px;border-radius:8px;background:rgba(255,255,255,.06);font-size:11px;font-weight:700;
  letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-decoration:none;white-space:nowrap;transition:.15s}
.top-btn:hover{background:rgba(255,255,255,.13);color:var(--cream)}

/* ================= BRIEF ================= */
#brief{position:fixed;left:14px;top:calc(var(--topbar) + 14px);width:var(--brief);z-index:900;
  max-height:calc(100vh - var(--topbar) - 28px);overflow-y:auto;scrollbar-width:thin;scrollbar-color:#33504a transparent;
  background:var(--panel);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:14px;
  box-shadow:0 16px 46px rgba(0,0,0,.6);padding:14px 16px 15px}
#brief::-webkit-scrollbar{width:7px}
#brief::-webkit-scrollbar-thumb{background:#33504a;border-radius:8px}
.brief-kick{font-size:9.5px;font-weight:800;letter-spacing:.15em;text-transform:uppercase;color:var(--amber)}
.brief-title{margin:4px 0 6px;font-size:18px;font-weight:800;letter-spacing:-.015em;line-height:1.2}
.brief-route{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12.5px;color:var(--soft);font-weight:600}
.brief-route .arr{color:var(--muted)}
.brief-chip{font-size:10px;font-weight:800;letter-spacing:.05em;background:rgba(63,180,166,.18);color:#8fe0d4;
  padding:3px 7px;border-radius:5px;white-space:nowrap}
.brief-wx[hidden]{display:none}
.brief-wx{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-top:10px;padding:8px 10px;border-radius:8px;
  background:rgba(125,164,232,.13);border-left:2px solid #7DA4E8;font-size:11.5px;color:#cfdcd7;line-height:1.35}
.brief-wx .wx-ico{font-size:22px;line-height:1}
.brief-wx .wx-t{font-size:16px;font-weight:800;color:#fff}
.brief-wx .wx-t small{font-size:11px;font-weight:700;color:var(--muted)}
.brief-wx .wx-x{flex:1 1 140px}
.brief-wx .wx-k{flex:0 0 100%;font-size:8.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:#9db6e0;margin-top:-2px}
.brief-notes{margin:9px 0 0;font-size:12.5px;color:#bccbc5;line-height:1.55}
.brief-h{margin-top:12px;font-size:8.5px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.brief-stops{list-style:none;margin:5px 0 0;padding:0}
.brief-stop{display:flex;gap:8px;padding:6px 0;border-top:1px solid rgba(255,255,255,.07);font-size:12px;line-height:1.45;
  align-items:flex-start;cursor:default}
.brief-stop:first-child{border-top:0}
.brief-stop.has-place{cursor:pointer}
.brief-stop.has-place:hover{color:#fff}
.brief-stop .ico{flex:0 0 1.5em;font-size:14px;line-height:1.2}
.brief-stop .nm{font-weight:700}
.brief-stop .nm a{color:var(--amber);text-decoration:none}
.brief-stop .nm a:hover{text-decoration:underline}
.brief-stop .sn{color:var(--muted)}
.brief-stop .sp{display:inline-block;margin-left:6px;font-size:9.5px;font-weight:800;color:var(--amber);
  background:rgba(242,179,61,.16);padding:1px 5px;border-radius:4px;vertical-align:1px}
.brief-stop a.sp-bk{color:#8fe0d4;background:rgba(63,180,166,.18);text-decoration:none}
.brief-stop a.sp-bk:hover{text-decoration:underline}
.brief-bed{margin-top:12px;font-size:11.5px;background:rgba(232,100,58,.15);border-left:2px solid var(--coral);
  padding:8px 10px;border-radius:0 7px 7px 0;color:#f6cdb9;line-height:1.5}
.brief-bed b{color:#fff}
.brief-bed a{color:var(--amber);text-decoration:none;font-weight:700;white-space:nowrap}
.brief-bed a:hover{text-decoration:underline}
.brief-stats{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.brief-stat{background:rgba(255,255,255,.07);border-radius:7px;padding:5px 9px;text-align:center;flex:1 1 auto}
.brief-stat .v{font-size:12.5px;font-weight:800;line-height:1.1}
.brief-stat .k{font-size:8.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:2px}
.brief-leg{margin-top:11px;font-size:8.5px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;display:flex;
  align-items:center;gap:7px}
.brief-leg .sw{width:14px;border-top:3px solid;border-radius:2px}
.brief-row{display:flex;gap:9px;padding:6px 7px;border-radius:8px;cursor:pointer;transition:.15s;align-items:baseline;
  min-height:32px}
.brief-row:hover{background:rgba(255,255,255,.07)}
.brief-row .rd{flex:0 0 40px;font-size:9.5px;font-weight:800;letter-spacing:.05em;color:var(--amber);text-transform:uppercase}
.brief-row .rt{font-size:12px;font-weight:700;line-height:1.3;flex:1 1 auto}
.brief-row .rc{font-size:9.5px;color:var(--muted);font-weight:700;white-space:nowrap}
.brief-foot{margin-top:12px;padding-top:9px;border-top:1px solid var(--line);font-size:10px;color:#6f8983;line-height:1.5}
.brief-foot a{color:#a9bdb7;text-decoration:none}

/* ================= PHOTO CARDS ================= */
#cards{position:fixed;right:14px;top:calc(var(--topbar) + 14px);bottom:14px;width:var(--cards);z-index:900;
  display:flex;flex-direction:column;justify-content:center;gap:12px;pointer-events:none}
.card{pointer-events:auto;display:flex;flex-direction:column;min-height:0;background:rgba(14,30,27,.95);border:1px solid rgba(244,239,231,.2);border-radius:12px;
  overflow:hidden;box-shadow:0 14px 40px rgba(0,0,0,.65);cursor:pointer;position:relative;
  transition:transform .18s ease,box-shadow .18s ease;animation:cardin .34s ease both}
.card:hover{transform:translateX(-5px) scale(1.02);box-shadow:0 18px 52px rgba(0,0,0,.8);border-color:var(--amber)}
@keyframes cardin{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}
.card-ph{flex:1 1 128px;min-height:72px;background:linear-gradient(135deg,#2b4a44,#132622);position:relative;overflow:hidden}
.card-ph img{position:absolute;inset:0}
.card-badge svg,.pin-dot svg{display:block}
.card-ph img{width:100%;height:100%;object-fit:cover;display:block}
.card-badge{position:absolute;left:8px;top:8px;width:26px;height:26px;border-radius:50%;background:var(--amber);
  color:#1a1206;font-size:13px;font-weight:900;display:flex;align-items:center;justify-content:center;
  border:2px solid rgba(12,22,20,.9);box-shadow:0 3px 10px rgba(0,0,0,.6);z-index:3}
.card-badge.bed{background:var(--coral);color:#fff}
.card-name{position:absolute;left:8px;bottom:8px;background:var(--amber);color:#1a1206;font-size:11px;
  font-weight:800;padding:3px 8px;border-radius:5px;z-index:2;max-width:calc(100% - 16px);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card-tag{position:absolute;right:8px;top:8px;background:rgba(12,22,20,.85);color:var(--coral2);font-size:9px;
  font-weight:800;letter-spacing:.1em;text-transform:uppercase;padding:3px 7px;border-radius:5px;z-index:2;
  border:1px solid rgba(232,100,58,.5)}
.card-cred{position:absolute;right:6px;bottom:6px;z-index:2;font-size:8.5px;color:rgba(244,239,231,.55);
  background:rgba(12,22,20,.6);padding:2px 5px;border-radius:4px;text-decoration:none;max-width:55%;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card-cred:hover{color:var(--amber)}
.card-meta{flex:0 0 auto;padding:8px 11px 10px}
.card-blurb{font-size:11.5px;color:#bccbc5;line-height:1.45}
.card-chips{display:flex;gap:5px;margin-top:6px;flex-wrap:wrap}
.card-chip{font-size:9.5px;font-weight:800;letter-spacing:.02em;background:rgba(255,255,255,.09);
  color:#cfdcd7;padding:2.5px 6px;border-radius:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}

/* ================= MARKERS ================= */
.pin{position:relative;width:0;height:0}
.pin-dot{position:absolute;transform:translate(-50%,-50%);border-radius:50%;display:flex;align-items:center;
  justify-content:center;font-weight:900;color:#fff;border:2.5px solid #fff;box-shadow:0 3px 13px rgba(0,0,0,.7);
  transition:transform .18s ease;cursor:pointer}
.pin:hover .pin-dot{transform:translate(-50%,-50%) scale(1.16)}
.pin-num .pin-dot{width:30px;height:30px;font-size:14px;background:var(--amber);color:#1a1206}
.pin-bed .pin-dot{width:34px;height:34px;font-size:15px;background:#132622;border-color:var(--coral);color:var(--coral)}
.pin-way .pin-dot{width:13px;height:13px;background:var(--cream);border-width:2px;border-color:#3a5850}
.pin-lbl{position:absolute;left:50%;top:calc(50% + 19px);transform:translateX(-50%);background:rgba(10,18,16,.88);
  color:var(--cream);font-size:10.5px;font-weight:700;padding:2.5px 7px;border-radius:5px;white-space:nowrap;
  border:1px solid rgba(244,239,231,.17);pointer-events:none;text-shadow:0 1px 2px #000}
.pin-up .pin-lbl{top:auto;bottom:calc(50% + 19px)}
.pin-bed .pin-lbl{border-color:rgba(232,100,58,.55);color:#ffd9c9}
.pin-way .pin-lbl{top:calc(50% + 9px);font-size:9.5px;font-weight:600;color:#c6d5cf;background:rgba(10,18,16,.72);padding:1.5px 5px}
.pin-nb{position:absolute;left:calc(50% + 13px);top:calc(50% - 21px);transform:translateX(-50%);background:var(--coral);
  color:#fff;font-size:9px;font-weight:800;padding:2px 5px;border-radius:4px;border:1.5px solid #132622;
  white-space:nowrap;pointer-events:none}
.zfar .pin-way{display:none}
.zfar .pin-num .pin-lbl{display:none}

.halo{position:relative;width:0;height:0}
.halo-ring{position:absolute;transform:translate(-50%,-50%);width:44px;height:44px;border-radius:50%;
  border:2.5px solid var(--coral);animation:halo 2.1s infinite}
@keyframes halo{0%{box-shadow:0 0 0 0 rgba(232,100,58,.6)}70%{box-shadow:0 0 0 26px rgba(232,100,58,0)}100%{box-shadow:0 0 0 0 rgba(232,100,58,0)}}
.halo-tag{position:absolute;left:50%;bottom:calc(50% + 29px);transform:translateX(-50%);background:var(--coral);
  color:#fff;font-size:9.5px;font-weight:900;letter-spacing:.1em;text-transform:uppercase;padding:3px 8px;
  border-radius:5px;white-space:nowrap;box-shadow:0 3px 12px rgba(0,0,0,.6)}

/* ================= POPUPS ================= */
.leaflet-popup-content-wrapper{background:var(--panel-solid);color:var(--cream);border-radius:14px;padding:0;
  border:1px solid rgba(244,239,231,.16);overflow:hidden;box-shadow:0 20px 56px rgba(0,0,0,.75)}
.leaflet-popup-content{margin:0;width:290px !important;line-height:1.5}
.leaflet-popup-tip{background:var(--panel-solid);border:1px solid rgba(244,239,231,.16)}
.leaflet-popup-close-button{color:#fff !important;font-size:22px !important;width:30px !important;height:30px !important;
  padding:2px 0 0 0 !important;text-shadow:0 1px 3px #000;z-index:5}
.pop-img{height:130px;background:linear-gradient(135deg,#2b4a44,#132622);position:relative;overflow:hidden}
.pop-img img{width:100%;height:100%;object-fit:cover;display:block}
.pop-img::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(12,22,20,0) 42%,rgba(12,22,20,.93) 100%)}
.pop-cap{position:absolute;left:14px;right:14px;bottom:9px;z-index:2}
.pop-kick{font-size:9.5px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--amber);text-shadow:0 1px 4px #000}
.pop-cap h3{margin:2px 0 0;font-size:16.5px;font-weight:800;line-height:1.2;text-shadow:0 2px 8px rgba(0,0,0,.85)}
.pop-body{padding:12px 14px 14px}
.pop-body p{margin:0 0 9px;font-size:12.5px;color:#c8d6d0}
.pop-row{display:flex;gap:8px;font-size:11.5px;color:#b3c4be;padding:5px 0;border-top:1px solid rgba(255,255,255,.07)}
.pop-row .ico{flex:0 0 1.4em}
.pop-row a{color:var(--amber);text-decoration:none}
.pop-btn{display:inline-block;margin-top:10px;background:var(--coral);color:#fff;text-decoration:none;font-size:10.5px;
  font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:8px 13px;border-radius:7px}
.pop-cred{margin-top:9px;font-size:9.5px;color:#5f7873}

/* ================= LEGEND ================= */
#legend{position:fixed;left:50%;transform:translateX(-50%);bottom:14px;z-index:890;display:flex;gap:14px;
  align-items:center;background:rgba(12,22,20,.9);backdrop-filter:blur(10px);border:1px solid var(--line);
  border-radius:11px;padding:9px 15px;box-shadow:0 8px 30px rgba(0,0,0,.55);font-size:11px;color:#c0cec8}
.legend-i{display:flex;align-items:center;gap:7px;white-space:nowrap}
.legend-sw{width:22px;border-top:3px solid;border-radius:2px}
.legend-sw.dash{border-top-style:dashed}
.legend-dot{width:12px;height:12px;border-radius:50%;border:2px solid #fff}

.leaflet-control-attribution{background:rgba(12,22,20,.85) !important;color:#6f8983 !important;font-size:9px !important}
.leaflet-control-attribution a{color:#8ea39d !important}
.leaflet-bar a{background:#1d3029 !important;color:var(--cream) !important;border-color:var(--line) !important}
.leaflet-bar a:hover{background:#2b4a44 !important}
.leaflet-container .leaflet-tooltip{background:rgba(10,18,16,.9);color:var(--cream);border:1px solid var(--line);
  border-radius:6px;font-size:11px;font-weight:700;box-shadow:0 4px 14px rgba(0,0,0,.5)}
.leaflet-tooltip-top:before{border-top-color:rgba(10,18,16,.9)}

/* ================= RESPONSIVE ================= */
@media (max-width:1180px){
  :root{--brief:300px;--cards:240px}
  .card-ph{flex-basis:108px}
  .card-blurb{display:none}
}
@media (max-width:760px){
  :root{--topbar:58px}
  html,body{overflow:auto;height:auto}
  #top{gap:8px;padding:0 8px}
  #brand{display:none}
  #nav{justify-content:flex-start;gap:4px}
  .nav-day{min-width:56px;padding:4px 8px 5px}
  .nav-day .nav-v{font-size:12px}
  .nav-arrow{width:28px;height:28px}
  .top-btn{display:none}
  .base-btn{padding:6px 6px;font-size:8px}
  #map{position:fixed;top:var(--topbar);left:0;right:0;bottom:auto;height:45vh;z-index:1}
  #cards{position:relative;top:auto;right:auto;bottom:auto;width:auto;flex-direction:row;justify-content:flex-start;
    overflow-x:auto;gap:10px;padding:10px 12px 4px;margin-top:calc(var(--topbar) + 45vh);pointer-events:auto;z-index:2}
  #cards::-webkit-scrollbar{display:none}
  #cards:empty{padding:0}
  .card{flex:0 0 200px}
  .card:hover{transform:none}
  .card-ph{flex-basis:96px;flex-grow:0}
  #brief{position:relative;left:auto;top:auto;width:auto;max-height:none;margin:8px 12px 48px;backdrop-filter:none;
    background:var(--panel-solid)}
  #legend{display:none}
  .leaflet-control-zoom{display:none}     /* pinch instead; the buttons sit on top of the pins */
  .leaflet-popup-content{width:240px !important}
}
</style>
</head>
<body>

<div id="top">
  <div id="brand"><span class="brand-t">Aotearoa <em>2026</em></span><span class="brand-d" id="brand-d"></span></div>
  <div id="nav">
    <button class="nav-arrow" id="nav-prev" title="Previous day (←)" aria-label="Previous day">‹</button>
    <div id="nav-days"></div>
    <button class="nav-arrow" id="nav-next" title="Next day (→)" aria-label="Next day">›</button>
  </div>
  <div id="topright">
    <div class="base-switch" id="base-switch" role="group" aria-label="Map style"></div>
    <a class="top-btn" id="sheet-link" target="_blank" rel="noopener" hidden>Sheet ↗</a>
  </div>
</div>

<div id="map"></div>
<div id="cards"></div>
<aside id="brief"></aside>

<div id="legend">
  <div class="legend-i"><span class="legend-sw" style="border-color:#E8643A"></span>Drive</div>
  <div class="legend-i"><span class="legend-sw dash" style="border-color:#3FB4A6"></span>Bike / boat</div>
  <div class="legend-i"><span class="legend-dot" style="background:#F2B33D"></span>Stop</div>
  <div class="legend-i"><span class="legend-dot" style="background:#132622;border-color:#E8643A"></span>Tonight's bed</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
window.TRIP_DATA = /*__TRIP_DATA__*/null;
</script>
<script>
/* ==========================================================================
   AOTEAROA 2026 — day-by-day road trip map.
   Everything trip-specific comes from window.TRIP_DATA, which the build
   inlines from the shared Google Sheet. Nothing about the route lives here.
   ========================================================================== */
(function () {
  'use strict';

  /* ---- knobs ---- */
  const DEFAULT_BASEMAP = 'satellite';        // 'satellite' | 'topo'  (flip at the end)
  const BASEMAP_KEY = 'aotearoa-basemap';
  const MAX_CARDS = 4;
  const LEG_COLOURS = ['#E8643A', '#F2B33D', '#3FB4A6', '#7DA4E8', '#C77DFF', '#8FD0A8', '#f59a7a'];
  const ICONS = { food: '🥧', walk: '🥾', hike: '🥾', tramp: '🥾', drive: '🚗', activity: '🎯', bike: '🚲', ride: '🚲', booked: '🎟️',
    boat: '🚤', cruise: '🚤', ferry: '⛴️', kayak: '🛶', wine: '🍷', beach: '🏖️', view: '📷', swim: '🏊' };
  const WX_DAYS = 16;                         // Open-Meteo's forecast horizon; the strip only shows inside it
  const WX_TTL = 30 * 60 * 1000;              // re-fetch a town's forecast after 30 min

  const D = window.TRIP_DATA;
  const briefEl = document.getElementById('brief');
  if (!D || !D.days || !D.days.length) { briefEl.innerHTML = '<div class="brief-kick">No itinerary data yet</div>'; return; }

  /* ---- data ---- */
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const PLACES = {};
  (D.places || []).forEach(p => {
    const lat = +p.lat, lng = +p.lng;
    if (Number.isFinite(lat) && Number.isFinite(lng)) PLACES[p.name] = Object.assign({}, p, { at: [lat, lng] });
  });
  const DAYS = D.days.map(d => Object.assign({}, d, { stops: d.stops || [], n: +d.day }));
  const SHEET_URL = D.sheet_id ? `https://docs.google.com/spreadsheets/d/${D.sheet_id}/edit` : '';
  const BOOKINGS_URL = SHEET_URL ? `${SHEET_URL}#gid=${D.bookings_gid || 0}` : '';
  const LEGS = [];
  DAYS.forEach(d => { if (d.leg && !LEGS.includes(d.leg)) LEGS.push(d.leg); });
  const legColour = leg => LEG_COLOURS[Math.max(0, LEGS.indexOf(leg)) % LEG_COLOURS.length];

  /* a place's photo: the direct thumbnail photos.py resolved, else the sheet's URL, else Commons by filename */
  const photoUrl = p => p.photo_url || (!p.photo ? '' : /^https?:\/\//.test(p.photo) ? p.photo
    : 'https://commons.wikimedia.org/wiki/Special:FilePath/' + encodeURIComponent(p.photo) + '?width=760');
  /* crossorigin only for Wikimedia's image hosts, which answer with CORS headers: that lets sw.js cache the photo
     offline without the padded quota of an opaque response. Other hosts load the ordinary way. */
  const photoImg = p => { const u = photoUrl(p); return u ? `<img src="${esc(u)}" alt="" loading="lazy"${/^https:\/\/(upload|thumb)\.wikimedia\.org\//.test(u) ? ' crossorigin="anonymous"' : ''} onerror="this.style.display='none'">` : ''; };
  const iconFor = t => ICONS[(t || '').trim().toLowerCase()] || '📍';
  /* "📷 Artist · CC BY-SA 4.0" linking to the Commons file page, when photos.py found one */
  const credit = (p, cls) => {
    if (!p.photo || !(p.photo_credit || p.photo_page)) return '';
    const text = '📷 ' + esc(p.photo_credit || 'Wikimedia Commons');
    return p.photo_page ? `<a class="${cls}" href="${esc(p.photo_page)}" target="_blank" rel="noopener" title="Photo credit" onclick="event.stopPropagation()">${text}</a>`
                        : `<span class="${cls}">${text}</span>`;
  };
  /* inline icons: emoji render differently (or badly) per platform, these don't */
  const BED = '<svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor" aria-label="bed"><path d="M4 5a1 1 0 0 1 1 1v6h6V8.5A1.5 1.5 0 0 1 12.5 7H18a3 3 0 0 1 3 3v8a1 1 0 1 1-2 0v-2H5v2a1 1 0 1 1-2 0V6a1 1 0 0 1 1-1zm3 2.5A1.75 1.75 0 1 1 7 11a1.75 1.75 0 0 1 0-3.5z"/></svg>';
  const PLANE = '<svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor" aria-label="flight"><path d="M21 16v-2l-8-5V3.5a1.5 1.5 0 0 0-3 0V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5z"/></svg>';
  const mapsUrl = at => `https://www.google.com/maps/search/?api=1&query=${at[0]},${at[1]}`;

  const isoRe = /^(\d{4})-(\d{2})-(\d{2})$/;
  const dateOf = iso => isoRe.test(iso || '') ? new Date(iso + 'T12:00:00Z') : null;
  const fmt = (iso, opts) => { const d = dateOf(iso); return d ? new Intl.DateTimeFormat('en-NZ', Object.assign({ timeZone: 'UTC' }, opts)).format(d) : ''; };
  const dow = iso => fmt(iso, { weekday: 'short' });
  const dmon = iso => fmt(iso, { day: 'numeric', month: 'short' });
  const longDate = iso => fmt(iso, { weekday: 'long', day: 'numeric', month: 'long' });
  /* today's date in New Zealand as YYYY-MM-DD, whatever clock the phone is on */
  const nzToday = () => {
    try { return new Intl.DateTimeFormat('en-CA', { timeZone: 'Pacific/Auckland', year: 'numeric', month: '2-digit', day: '2-digit' }).format(new Date()); }
    catch (e) { return new Date().toISOString().slice(0, 10); }
  };
  const daysFrom = (a, b) => Math.round((dateOf(b) - dateOf(a)) / 864e5);   // whole days from ISO a to ISO b
  /* a stop's link: the sheet's URL, or the word `tides` → NIWA's tide forecaster for that place on that day */
  const isTides = s => /^tides$/i.test((s.link || '').trim());
  const linkOf = (s, d) => {
    if (!isTides(s)) return (s.link || '').trim();
    const p = PLACES[s.place] || PLACES[d.to]; if (!p) return '';
    return `https://tides.niwa.co.nz/?latitude=${p.at[0]}&longitude=${p.at[1]}${dateOf(d.date) ? `&startDate=${d.date}` : ''}&numberOfDays=2`;
  };
  const stopName = (s, d) => {
    const url = linkOf(s, d); if (!url) return esc(s.name);
    return `<a href="${esc(url)}" target="_blank" rel="noopener"${isTides(s) ? ' title="Tide times for the day (NIWA)"' : ''}>${esc(s.name)}${isTides(s) ? ' · 🌊 tides' : ''} ↗</a>`;
  };
  const isBooked = s => /^booked$/i.test((s.type || '').trim());
  const mins = t => {
    t = String(t || '');
    const h = /(\d+)\s*h\s*(\d*)/i.exec(t); if (h) return +h[1] * 60 + (+h[2] || 0);
    const m = /(\d+)\s*m/i.exec(t); return m ? +m[1] : 0;
  };
  const hours = m => m ? `~${Math.round(m / 60)}h` : '';
  /* "4h30 · 426 km" for a day, or '' if the sheet and OSRM both have nothing */
  const driveText = d => [d.drive_time, d.drive_km ? `${d.drive_km} km` : ''].filter(Boolean).map(esc).join(' · ');
  const driveChip = (d, sep) => { const t = driveText(d); return t ? sep + t : ''; };

  /* ordered, de-duplicated places for a day: from → stop places → to */
  function dayPlaces(d) {
    const seq = [];
    const push = n => { if (n && PLACES[n] && seq[seq.length - 1] !== n) seq.push(n); };
    push(d.from); d.stops.forEach(s => { if (!s.spur) push(s.place); }); push(d.to);
    return seq;
  }
  const stopsAt = (d, name) => d.stops.filter(s => s.place === name);

  /* legs we don't drive (a stop typed bike / boat / ... with a place): dashed from the last road place, never routed */
  function daySpurs(d) {
    const out = []; let anchor = PLACES[d.from] ? d.from : null;
    d.stops.forEach(s => {
      if (!s.place || !PLACES[s.place]) return;
      if (s.spur) { if (anchor && anchor !== s.place) out.push({ from: anchor, to: s.place, s }); }
      else anchor = s.place;
    });
    return out;
  }
  function drawSpurs(d, pts, weight, onClick) {
    daySpurs(d).forEach(sp => {
      const line = [PLACES[sp.from].at, PLACES[sp.to].at];
      L.polyline(line, { color: '#0b1412', weight: weight + 3, opacity: .4, dashArray: '2 10', lineCap: 'round' }).addTo(layer);
      const l = L.polyline(line, { color: '#3FB4A6', weight, opacity: .95, dashArray: '2 10', lineCap: 'round' })
        .bindTooltip(`${iconFor(sp.s.type)} ${esc(sp.s.name)}`, { sticky: true }).addTo(layer);
      if (onClick) l.on('click', onClick);
      pts.push(line[1]);
    });
  }

  /* Google encoded polyline (precision 5) → [[lat, lng], ...] */
  function decodePoly(str) {
    const pts = []; let i = 0, lat = 0, lng = 0;
    while (i < str.length) {
      let b, shift = 0, result = 0;
      do { b = str.charCodeAt(i++) - 63; result |= (b & 0x1f) << shift; shift += 5; } while (b >= 0x20);
      lat += (result & 1) ? ~(result >> 1) : (result >> 1);
      shift = 0; result = 0;
      do { b = str.charCodeAt(i++) - 63; result |= (b & 0x1f) << shift; shift += 5; } while (b >= 0x20);
      lng += (result & 1) ? ~(result >> 1) : (result >> 1);
      pts.push([lat / 1e5, lng / 1e5]);
    }
    return pts;
  }
  const ROUTES = D.routes || {};
  const pathCache = {};
  /* the day's drive as drawn: OSRM road geometry per leg where routes.py found one, else a straight segment */
  function dayPath(d) {
    if (pathCache[d.n]) return pathCache[d.n];
    const seq = dayPlaces(d);
    const keys = Array.isArray(d.legs) && d.legs.length === seq.length - 1 ? d.legs : [];
    const path = [];
    for (let i = 0; i < seq.length - 1; i++) {
      const r = ROUTES[keys[i]];
      const seg = r && r.poly ? decodePoly(r.poly) : [PLACES[seq[i]].at, PLACES[seq[i + 1]].at];
      seg.forEach((pt, j) => { if (j || !path.length) path.push(pt); });   // don't repeat the joint
    }
    return (pathCache[d.n] = path);
  }

  /* the numbered places for a day: stop places in order, then tonight's town */
  function dayCards(d) {
    const out = [];
    const add = (name, tag) => { if (PLACES[name] && !out.some(c => c.name === name)) out.push({ name, p: PLACES[name], tag }); };
    d.stops.forEach(s => add(s.place, ''));
    add(d.to, 'Tonight');
    out.forEach((c, i) => { c.i = i + 1; c.bed = c.name === d.to; });
    return out;
  }

  /* sleeping towns across the trip, with night counts, in visit order */
  function beds() {
    const out = [];
    DAYS.forEach(d => {
      if (!PLACES[d.to]) return;
      const b = out.find(x => x.name === d.to);
      if (b) { b.nights++; b.days.push(d.n); } else out.push({ name: d.to, p: PLACES[d.to], nights: 1, days: [d.n] });
    });
    return out;
  }

  /* ---- map + basemaps ---- */
  const map = L.map('map', { zoomControl: false, minZoom: 4, maxZoom: 17, zoomSnap: .25, scrollWheelZoom: true });
  const cartoAttr = '&copy; <a href="https://carto.com/">CARTO</a> &copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>';
  const BASEMAPS = {
    satellite: { label: 'Sat', layer: L.layerGroup([
      L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
        { maxZoom: 17, crossOrigin: 'anonymous', attribution: 'Imagery &copy; Esri, Maxar, Earthstar Geographics' }),
      L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager_only_labels/{z}/{x}/{y}{r}.png',
        { maxZoom: 19, subdomains: 'abcd', opacity: .85, crossOrigin: 'anonymous', attribution: cartoAttr })]) },
    topo: { label: 'Topo', layer: L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png',
      { maxZoom: 17, subdomains: 'abc', crossOrigin: 'anonymous', attribution: '&copy; <a href="https://opentopomap.org">OpenTopoMap</a> (CC-BY-SA) &copy; OpenStreetMap' }) },
  };
  let baseKey = null;
  function setBasemap(key, remember) {
    if (!BASEMAPS[key]) key = DEFAULT_BASEMAP;
    if (baseKey) map.removeLayer(BASEMAPS[baseKey].layer);
    BASEMAPS[key].layer.addTo(map);
    baseKey = key;
    document.body.dataset.basemap = key;
    document.querySelectorAll('.base-btn').forEach(b => b.classList.toggle('on', b.dataset.key === key));
    if (remember) { try { localStorage.setItem(BASEMAP_KEY, key); } catch (e) { /* private mode */ } }
  }
  const switchEl = document.getElementById('base-switch');
  Object.keys(BASEMAPS).forEach(key => {
    const b = document.createElement('button');
    b.className = 'base-btn'; b.dataset.key = key; b.textContent = BASEMAPS[key].label;
    b.title = 'Map style: ' + BASEMAPS[key].label;
    b.onclick = () => setBasemap(key, true);
    switchEl.appendChild(b);
  });
  let saved = null;
  try { saved = localStorage.getItem(BASEMAP_KEY); } catch (e) { /* ignore */ }
  setBasemap(saved || DEFAULT_BASEMAP, false);
  L.control.zoom({ position: 'topright' }).addTo(map);
  map.on('zoomend', () => map.getContainer().classList.toggle('zfar', map.getZoom() < 7.5));

  const layer = L.layerGroup().addTo(map);      // everything for the current view
  let cur = 0;                                  // 0 = overview, i = DAYS[i-1]
  let activeCards = [];

  /* ---- chrome that only depends on data ---- */
  const firstFrom = DAYS[0].from || DAYS[0].to;
  /* where we are relative to the trip, by New Zealand's calendar: before, during or after */
  function tripStatus() {
    const first = DAYS[0].date, last = DAYS[DAYS.length - 1].date, today = nzToday();
    if (!dateOf(first) || !dateOf(last) || !dateOf(today)) return null;
    const toGo = daysFrom(today, first), since = daysFrom(last, today);
    if (toGo > 0) return { text: toGo === 1 ? 'Tomorrow!' : `${toGo} days to go`, n: toGo, k: toGo === 1 ? 'day to go' : 'days to go' };
    if (since > 0) return { text: 'Home again', n: since, k: since === 1 ? 'day home' : 'days home' };
    const td = DAYS.find(d => d.date === today);
    return td ? { text: `Day ${td.n} of ${DAYS.length}`, n: td.n, k: `of ${DAYS.length}` } : null;
  }
  const STATUS = tripStatus();
  document.getElementById('brand-d').textContent = `${STATUS ? STATUS.text : DAYS.length + ' days'} · ${firstFrom} loop`;
  const sheetLink = document.getElementById('sheet-link');
  if (SHEET_URL) { sheetLink.href = SHEET_URL; sheetLink.hidden = false; }

  const navEl = document.getElementById('nav-days');
  const navBtn = (k, v, cls) => {
    const b = document.createElement('button');
    b.className = 'nav-day' + (cls ? ' ' + cls : '');
    b.innerHTML = `<div class="nav-k">${esc(k)}</div><div class="nav-v">${esc(v)}</div>`;
    navEl.appendChild(b); return b;
  };
  navBtn('Trip', 'Overview', 'nav-all').onclick = () => render(0);
  DAYS.forEach((d, i) => {
    const b = navBtn('Day ' + d.n, d.date && dateOf(d.date) ? `${dow(d.date)} ${dmon(d.date)}` : d.to || String(d.n));
    b.title = d.title || `${d.from} → ${d.to}`;
    b.onclick = () => render(i + 1);
  });

  /* ---- popups ---- */
  function popHTML(p, kick, stops, d) {
    const photo = photoUrl(p);
    const img = `<div class="pop-img">${photoImg(p)}
      <div class="pop-cap"><div class="pop-kick">${esc(kick || p.kind || '')}</div><h3>${esc(p.name)}</h3></div></div>`;
    const rows = (stops || []).map(s => `<div class="pop-row"><span class="ico">${iconFor(s.type)}</span><span>${stopName(s, d || {})}${s.notes ? ` <span style="color:#7f9790">· ${esc(s.notes)}</span>` : ''}</span></div>`).join('');
    const cred = photo ? `<div class="pop-cred">${credit(p, '') || 'Photo: Wikimedia Commons'}</div>` : '';
    return `<div class="pop">${img}<div class="pop-body">${p.blurb ? `<p>${esc(p.blurb)}</p>` : ''}${rows}
      <a class="pop-btn" href="${mapsUrl(p.at)}" target="_blank" rel="noopener">Maps ↗</a>${cred}</div></div>`;
  }
  const popOpts = () => {
    const mob = isMobile();
    return { maxWidth: 310, autoPanPaddingTopLeft: [mob ? 20 : panelW('--brief') + 30, 80], autoPanPaddingBottomRight: [mob ? 20 : panelW('--cards') + 30, mob ? 20 : 60] };
  };

  /* ---- markers ---- */
  const pinIcon = (cls, glyph, label, nb, up) => L.divIcon({ className: '', iconSize: [0, 0], html:
    `<div class="pin ${cls}${up ? ' pin-up' : ''}"><div class="pin-dot">${glyph || ''}</div>${nb ? `<div class="pin-nb">${esc(nb)}</div>` : ''}${label ? `<div class="pin-lbl">${esc(label)}</div>` : ''}</div>` });
  const haloIcon = tag => L.divIcon({ className: '', iconSize: [0, 0], html:
    `<div class="halo"><div class="halo-tag">${esc(tag)}</div><div class="halo-ring"></div></div>` });

  /* ---- render ---- */
  function render(i) {
    cur = Math.max(0, Math.min(DAYS.length, i));
    layer.clearLayers();
    const pts = [];
    activeCards = [];

    if (cur === 0) {
      /* the whole loop, one line per day in its leg's colour */
      DAYS.forEach(d => {
        const path = dayPath(d);
        if (path.length < 2) return;
        L.polyline(path, { color: '#0b1412', weight: 7, opacity: .4 }).addTo(layer);
        L.polyline(path, { color: legColour(d.leg), weight: 3.5, opacity: .95 })
          .bindTooltip(`Day ${d.n} · ${esc(d.from)} → ${esc(d.to)}${driveChip(d, ' · ')}`, { sticky: true })
          .on('click', () => render(DAYS.indexOf(d) + 1)).addTo(layer);
        path.forEach(p => pts.push(p));
        drawSpurs(d, pts, 2.5, () => render(DAYS.indexOf(d) + 1));
      });
      const bs = beds();
      bs.forEach((b, idx) => {
        const start = b.name === firstFrom;
        const nb = b.nights > 1 ? `${b.nights} nights` : (start ? 'in & out' : '');
        L.marker(b.p.at, { icon: pinIcon('pin-bed', start ? PLANE : BED, b.name, nb, idx % 2 === 0), zIndexOffset: 900 })
          .bindPopup(popHTML(b.p, `Nights: day${b.days.length > 1 ? 's' : ''} ${b.days.join(', ')}`, []), popOpts())
          .addTo(layer);
        pts.push(b.p.at);
        if (idx < MAX_CARDS) activeCards.push({ i: idx + 1, name: b.name, p: b.p, at: b.p.at, bed: true, tag: b.nights > 1 ? `${b.nights} nights` : '', chips: [] });
      });
    } else {
      const d = DAYS[cur - 1];
      const path = dayPath(d);
      if (path.length >= 2) {
        L.polyline(path, { color: '#0b1412', weight: 9, opacity: .45 }).addTo(layer);
        L.polyline(path, { color: '#E8643A', weight: 4, opacity: .96 })
          .bindTooltip(`${esc(d.from)} → ${esc(d.to)}${driveChip(d, ' · ')}`, { sticky: true }).addTo(layer);
      }
      path.forEach(p => pts.push(p));
      drawSpurs(d, pts, 4);

      /* where we woke up, if it isn't also a numbered place */
      const cards = dayCards(d);
      if (PLACES[d.from] && !cards.some(c => c.name === d.from)) {
        L.marker(PLACES[d.from].at, { icon: pinIcon('pin-way', '', d.from), zIndexOffset: 80 })
          .bindPopup(popHTML(PLACES[d.from], 'This morning', [], d), popOpts()).addTo(layer);
        pts.push(PLACES[d.from].at);
      }
      /* numbered pins, matching the cards */
      cards.forEach(c => {
        const stops = stopsAt(d, c.name);
        const kick = c.bed ? "Tonight's bed" : `Stop ${c.i}`;
        c.at = c.p.at;
        // bed label sits below the dot; the halo's "Tonight" tag takes the space above it
        const m = L.marker(c.at, { icon: pinIcon(c.bed ? 'pin-bed' : 'pin-num', c.bed ? BED : c.i, c.name, null, !c.bed), zIndexOffset: c.bed ? 800 : 700 })
          .bindPopup(popHTML(c.p, kick, stops, d), popOpts()).addTo(layer);
        c.m = m; c.chips = stops.map(s => `${iconFor(s.type)} ${s.name}`);
        if (!c.chips.length && c.bed && d.drive_time) c.chips.push(`🚗 ${d.drive_time}`);
      });
      if (PLACES[d.to]) {
        L.marker(PLACES[d.to].at, { icon: haloIcon('Tonight · ' + d.to), zIndexOffset: 600, interactive: false }).addTo(layer);
      }
      activeCards = cards.slice(0, MAX_CARDS);
    }

    fit(pts);
    paintCards();
    paintBrief();
    paintNav();
    try { history.replaceState(null, '', cur === 0 ? location.pathname + location.search : '#day-' + DAYS[cur - 1].n); } catch (e) { /* file:// etc */ }
  }

  const isMobile = () => window.innerWidth <= 760;
  const panelW = v => parseInt(getComputedStyle(document.documentElement).getPropertyValue(v)) || 0;
  let started = false;                          // Leaflet can't fly before it has a first view
  function fit(pts) {
    map.invalidateSize({ animate: false });
    if (!pts.length) return;
    const mob = isMobile();
    const opts = {
      paddingTopLeft: [mob ? 28 : panelW('--brief') + 40, mob ? 56 : 40],      // room for the "Tonight" tag
      paddingBottomRight: [mob ? 28 : panelW('--cards') + 40, mob ? 30 : 70],
      maxZoom: cur === 0 ? 8 : 11,
    };
    const bounds = L.latLngBounds(pts);
    if (!started) { map.fitBounds(bounds, Object.assign({ animate: false }, opts)); started = true; }
    else map.flyToBounds(bounds, Object.assign({ duration: .85 }, opts));
  }

  /* ---- cards ---- */
  function paintCards() {
    const box = document.getElementById('cards');
    box.innerHTML = '';
    activeCards.forEach((c, idx) => {
      const p = c.p;
      const el = document.createElement('div');
      el.className = 'card'; el.style.animationDelay = idx * 70 + 'ms';
      el.innerHTML = `
        <div class="card-ph">
          <div class="card-badge${c.bed ? ' bed' : ''}">${c.bed ? BED : c.i}</div>
          ${c.tag ? `<div class="card-tag">${esc(c.tag)}</div>` : ''}
          ${photoImg(p)}
          <div class="card-name">${esc(c.name)}</div>
          ${credit(p, 'card-cred')}
        </div>
        <div class="card-meta">${p.blurb ? `<div class="card-blurb">${esc(p.blurb)}</div>` : ''}
          ${c.chips.length ? `<div class="card-chips">${c.chips.map(t => `<span class="card-chip">${esc(t)}</span>`).join('')}</div>` : ''}</div>`;
      el.onclick = () => {
        map.flyTo(c.at, Math.max(map.getZoom(), 11), { duration: .7 });
        if (c.m) map.once('moveend', () => setTimeout(() => c.m.openPopup(), 40));
      };
      box.appendChild(el);
    });
  }

  /* ---- brief ---- */
  function paintBrief() {
    const foot = `<div class="brief-foot">Edit the trip in the ${SHEET_URL ? `<a href="${SHEET_URL}" target="_blank" rel="noopener">shared sheet ↗</a>` : 'shared sheet'}. The site rebuilds overnight, or on demand.</div>`;
    if (cur === 0) {
      const first = DAYS[0].date, last = DAYS[DAYS.length - 1].date;
      const when = first && last && dateOf(first) && dateOf(last) ? `${dmon(first)} – ${dmon(last)} ${fmt(last, { year: 'numeric' })}` : 'Dates to be confirmed';
      const drive = DAYS.reduce((s, d) => s + mins(d.drive_time), 0);
      const towns = beds();
      let rows = '';
      let leg = null;
      DAYS.forEach((d, i) => {
        if (d.leg && d.leg !== leg) { leg = d.leg; rows += `<div class="brief-leg" style="color:${legColour(leg)}"><span class="sw" style="border-color:${legColour(leg)}"></span>${esc(leg)}</div>`; }
        rows += `<div class="brief-row" data-i="${i + 1}"><span class="rd">Day ${d.n}</span><span class="rt">${esc(d.title || `${d.from} → ${d.to}`)}</span>${d.drive_time ? `<span class="rc">${esc(d.drive_time)}</span>` : ''}</div>`;
      });
      briefEl.innerHTML = `<div class="brief-kick">${esc(when)}</div>
        <h2 class="brief-title">${DAYS.length} days around the island</h2>
        <div class="brief-stats">
          ${STATUS ? `<div class="brief-stat" style="background:rgba(232,100,58,.2)"><div class="v">${STATUS.n}</div><div class="k">${esc(STATUS.k)}</div></div>` : ''}
          <div class="brief-stat"><div class="v">${DAYS.length}</div><div class="k">days</div></div>
          <div class="brief-stat"><div class="v">${towns.length}</div><div class="k">towns</div></div>
          ${drive ? `<div class="brief-stat"><div class="v">${hours(drive)}</div><div class="k">driving</div></div>` : ''}
          <div class="brief-stat"><div class="v">${DAYS.reduce((s, d) => s + d.stops.length, 0)}</div><div class="k">stops</div></div>
        </div>${rows}${foot}`;
      briefEl.querySelectorAll('.brief-row').forEach(r => r.onclick = () => render(+r.dataset.i));
      return;
    }
    const d = DAYS[cur - 1];
    const kick = [d.leg, `Day ${d.n}`, d.date && dateOf(d.date) ? longDate(d.date) : ''].filter(Boolean).join(' · ');
    const route = d.from && d.to && d.from !== d.to
      ? `<span>${esc(d.from)}</span><span class="arr">→</span><span>${esc(d.to)}</span>`
      : `<span>${esc(d.to || d.from)}</span>`;
    const stops = d.stops.map(s => {
      const c = activeCards.find(x => x.name === s.place);
      return `<li class="brief-stop${c ? ' has-place' : ''}" data-i="${c ? c.i : ''}"><span class="ico">${iconFor(s.type)}</span>
        <span><span class="nm">${stopName(s, d)}</span>${c ? `<span class="sp">${c.i}</span>` : ''}${isBooked(s) && BOOKINGS_URL ? `<a class="sp sp-bk" href="${BOOKINGS_URL}" target="_blank" rel="noopener" title="Booking details in the sheet">booked ↗</a>` : ''}
        ${s.notes ? `<div class="sn">${esc(s.notes)}</div>` : ''}</span></li>`;
    }).join('');
    briefEl.innerHTML = `<div class="brief-kick">${esc(kick)}</div>
      <h2 class="brief-title">${esc(d.title || `${d.from} → ${d.to}`)}</h2>
      <div class="brief-route">${route}${driveText(d) ? `<span class="brief-chip">🚗 ${driveText(d)}</span>` : ''}</div>
      <div class="brief-wx" id="brief-wx" hidden></div>
      ${d.notes ? `<p class="brief-notes">${esc(d.notes)}</p>` : ''}
      ${stops ? `<div class="brief-h">Stops</div><ul class="brief-stops">${stops}</ul>` : ''}
      ${d.to ? `<div class="brief-bed">🛏 Sleeping in <b>${esc(d.to)}</b>${BOOKINGS_URL ? ` · <a href="${BOOKINGS_URL}" target="_blank" rel="noopener">booking details ↗</a>` : ''}</div>` : ''}
      ${foot}`;
    briefEl.querySelectorAll('.brief-stop.has-place').forEach(li => li.onclick = e => {
      if (e.target.closest('a')) return;
      const c = activeCards.find(x => x.i === +li.dataset.i); if (!c) return;
      map.flyTo(c.at, Math.max(map.getZoom(), 11), { duration: .7 });
      if (c.m) map.once('moveend', () => setTimeout(() => c.m.openPopup(), 40));
    });
    briefEl.scrollTop = 0;
    paintWeather(d);
  }

  /* ---- weather: Open-Meteo for tonight's town, only once the day is inside the forecast window ---- */
  const WMO = [[0, '☀️', 'Clear'], [1, '🌤️', 'Mostly clear'], [2, '⛅', 'Partly cloudy'], [3, '☁️', 'Overcast'], [45, '🌫️', 'Fog'], [48, '🌫️', 'Fog'],
    [51, '🌦️', 'Drizzle'], [53, '🌦️', 'Drizzle'], [55, '🌧️', 'Drizzle'], [56, '🌧️', 'Freezing drizzle'], [57, '🌧️', 'Freezing drizzle'],
    [61, '🌧️', 'Light rain'], [63, '🌧️', 'Rain'], [65, '🌧️', 'Heavy rain'], [66, '🌧️', 'Freezing rain'], [67, '🌧️', 'Freezing rain'],
    [71, '🌨️', 'Light snow'], [73, '🌨️', 'Snow'], [75, '❄️', 'Heavy snow'], [77, '🌨️', 'Snow grains'], [80, '🌦️', 'Showers'], [81, '🌧️', 'Showers'],
    [82, '⛈️', 'Heavy showers'], [85, '🌨️', 'Snow showers'], [86, '🌨️', 'Snow showers'], [95, '⛈️', 'Thunderstorm'], [96, '⛈️', 'Thunder and hail'], [99, '⛈️', 'Thunder and hail']];
  const wmo = c => { const m = WMO.find(w => w[0] === c) || [0, '🌡️', '']; return { icon: m[1], text: m[2] }; };
  async function forecast(p) {                // daily forecast for a place; cached in this browser for WX_TTL
    const key = 'aotearoa-wx:' + p.name;
    try { const c = JSON.parse(localStorage.getItem(key)); if (c && Date.now() - c.t < WX_TTL) return c.data; } catch (e) { /* no cache */ }
    const url = `https://api.open-meteo.com/v1/forecast?latitude=${p.at[0]}&longitude=${p.at[1]}&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_sum,precipitation_probability_max,wind_speed_10m_max&timezone=Pacific%2FAuckland&forecast_days=${WX_DAYS}`;
    const r = await fetch(url); if (!r.ok) throw new Error('open-meteo ' + r.status);
    const data = (await r.json()).daily;
    try { localStorage.setItem(key, JSON.stringify({ t: Date.now(), data })); } catch (e) { /* private mode */ }
    return data;
  }
  function paintWeather(d) {
    const el = document.getElementById('brief-wx'); if (!el) return;
    const p = PLACES[d.to] || PLACES[d.from], today = nzToday();
    if (!p || !dateOf(d.date) || !dateOf(today)) return;
    const off = daysFrom(today, d.date);
    if (off < 0 || off >= WX_DAYS) return;      // past, or too far out to forecast
    const want = cur;
    forecast(p).then(w => {
      if (cur !== want) return;                 // the user has moved on
      const i = w.time.indexOf(d.date); if (i < 0) return;
      const c = wmo(w.weather_code[i]);
      el.innerHTML = `<span class="wx-ico">${c.icon}</span><span class="wx-t">${Math.round(w.temperature_2m_max[i])}°<small> / ${Math.round(w.temperature_2m_min[i])}°</small></span>
        <span class="wx-x">${esc(c.text)} · ${w.precipitation_probability_max[i]}% chance of rain, ${Math.round(w.precipitation_sum[i])} mm · 💨 ${Math.round(w.wind_speed_10m_max[i])} km/h</span>
        <span class="wx-k">Forecast for ${esc(p.name)} · ${off === 0 ? 'today' : off === 1 ? 'tomorrow' : 'in ' + off + ' days'}</span>`;
      el.hidden = false;
    }).catch(() => { /* offline or the API is down: the strip just stays hidden */ });
  }

  /* ---- nav ---- */
  function paintNav() {
    document.querySelectorAll('#nav-days .nav-day').forEach((el, i) => el.classList.toggle('on', i === cur));
    document.getElementById('nav-prev').disabled = cur === 0;
    document.getElementById('nav-next').disabled = cur === DAYS.length;
    const on = document.querySelector('#nav-days .nav-day.on');
    if (on) on.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
  }
  document.getElementById('nav-prev').onclick = () => render(cur - 1);
  document.getElementById('nav-next').onclick = () => render(cur + 1);
  document.addEventListener('keydown', e => {
    if (e.key === 'ArrowRight') render(cur + 1);
    if (e.key === 'ArrowLeft') render(cur - 1);
  });
  window.addEventListener('resize', () => { clearTimeout(window.__rt); window.__rt = setTimeout(() => render(cur), 260); });

  /* ---- start: a #day-N link, else today's day if mid-trip, else the overview ---- */
  function startView() {
    const m = /^#day-(\d+)$/.exec(location.hash);
    if (m) { const i = DAYS.findIndex(d => d.n === +m[1]); if (i >= 0) return i + 1; }
    const today = nzToday();
    const i = DAYS.findIndex(d => d.date === today);
    return i >= 0 ? i + 1 : 0;
  }
  render(startView());
  setTimeout(() => render(cur), 250);   // once fonts and layout have settled, refit

  /* ---- offline: sw.js keeps this page, Leaflet and every tile and photo you've looked at ---- */
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
    navigator.serviceWorker.register('sw.js').catch(() => { /* not fatal */ });
  }
})();
</script>
</body>
</html>
